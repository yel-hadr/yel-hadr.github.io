  <body>
    <script>
      // Before the first paint, as on the portfolio: the saved theme (else dark) and language
      // (else the browser's). In <body> because <head> is generated with the SEO tags.
      (function () {
        var root = document.documentElement;
        var theme, lang;
        try {
          theme = localStorage.getItem('theme');
          lang = localStorage.getItem('lang');
        } catch (e) {}
        if (theme !== 'light') theme = 'dark';
        if (lang !== 'en' && lang !== 'fr') {
          lang = /^fr\b/i.test(navigator.language || '') ? 'fr' : 'en';
        }
        root.dataset.theme = theme;
        root.lang = lang;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#faf7f2' : '#0b0e14';
        document.querySelector('meta[name="color-scheme"]').content = theme;
      })();
    </script>
    <div id="root"></div>
  </body>
